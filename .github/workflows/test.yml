name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build:vendor
      - name: Check committed vendor output
        shell: bash
        run: |
          git diff --exit-code -- .github/extensions/gridfinity-builder/vendor/
          untracked="$(git ls-files --others --exclude-standard -- .github/extensions/gridfinity-builder/vendor/)"
          if [[ -n "$untracked" ]]; then
            printf 'Commit the generated vendor files:\n%s\n' "$untracked"
            exit 1
          fi
